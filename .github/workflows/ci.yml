#
# The GitHub lane: the complete test suite, examples included, on Linux,
# macOS and Windows. Jobs must run sandboxed, so Linux installs bubblewrap and
# lifts Ubuntu's AppArmor limit on unprivileged user namespaces, which
# bubblewrap needs; macOS has sandbox-exec, Windows AppContainers. `omega
# sandbox` prints what the tests get, and fails the run if there is none.
# The private ck-git server runs the same tests (.ckgit/ci.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A full run takes 1-4 min; a stalled package mirror once held a job for the
    # 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04-arm, python: "3.13" }
          - { os: macos-15, python: "3.13" }
          - { os: windows-2025, python: "3.13" }
    steps:
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install compilers and the sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap clang g++
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Put LLVM first on PATH
        # The image has LLVM and the Visual Studio Build Tools; other toolchains
        # on PATH bring older clang builds.
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
      - name: Sandbox
        run: python -m omega_transform sandbox
      - name: Tests
        env:
          OMEGA_EXAMPLE_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Reference pages match the code
        run: python -m omega_transform docs --check
