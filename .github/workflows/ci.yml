#
# The GitHub lane: the complete test suite, examples included, on Linux and
# macOS. Jobs must run sandboxed, so Linux installs bubblewrap and lifts
# Ubuntu's AppArmor limit on unprivileged user namespaces, which bubblewrap
# needs; macOS has sandbox-exec. `omega sandbox` prints what the tests get.
# The private ck-git server runs the same tests (.ckgit/ci.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: ubuntu-24.04-arm, python: "3.13" }
          - { os: macos-15, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install compilers and the sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap clang g++
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Sandbox
        run: python -m omega_transform sandbox
      - name: Tests
        env:
          OMEGA_EXAMPLE_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Reference pages match the code
        run: python -m omega_transform docs --check
