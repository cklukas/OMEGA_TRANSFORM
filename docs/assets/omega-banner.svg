<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="OMEGA TRANSFORM: evolutionary program optimization with local language models">
  <!-- Copyright (c) 2026 by C. Klukas -->
  <!-- SPDX-License-Identifier: GPL-3.0-only -->
  <title>OMEGA TRANSFORM</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.45" stop-color="#0d1033"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <radialGradient id="halo" cx="200" cy="200" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7b6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="1060" cy="150" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ef0ff"/>
      <stop offset="0.5" stop-color="#7b6cff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="neonH" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.3" stop-color="#3ef0ff"/>
      <stop offset="0.65" stop-color="#7b6cff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ef0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7b6cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3ef0ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#halo)"/>
    <rect width="1280" height="400" fill="url(#halo2)"/>

    <!-- faint code rain on the right: the program being rewritten -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9fa8ff" fill-opacity="0.16">
      <text x="860" y="44">&lt;&lt;&lt;&lt;&lt;&lt;&lt; SEARCH</text>
      <text x="860" y="64">for i in range(n): r[i] = grow(r[i])</text>
      <text x="860" y="84">=======</text>
      <text x="860" y="104">r = relax(r, steps=64, lr=0.02)</text>
      <text x="860" y="124">&gt;&gt;&gt;&gt;&gt;&gt;&gt; REPLACE</text>
      <text x="1010" y="360"># OMEGA-BLOCK-START</text>
      <text x="1010" y="380">score: 2.6359 ▲</text>
    </g>

    <!-- fitness climbing over generations -->
    <path d="M880 326 C915 322 925 300 950 296 S1010 250 1050 240 S1110 180 1150 172 S1210 120 1250 112 V400 H880 Z" fill="url(#area)"/>
    <path d="M880 326 C915 322 925 300 950 296 S1010 250 1050 240 S1110 180 1150 172 S1210 120 1250 112" fill="none" stroke="url(#neonH)" stroke-width="3" filter="url(#softglow)"/>

    <!-- lineage: candidates branching, the best line lit -->
    <g stroke="#7b6cff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M950 296 L985 330"/><path d="M1050 240 L1080 285"/><path d="M1050 240 L1095 225"/>
      <path d="M1150 172 L1180 215"/><path d="M1150 172 L1190 160"/><path d="M950 296 L995 270"/>
    </g>
    <g fill="#7b6cff" fill-opacity="0.55">
      <circle cx="985" cy="330" r="3.5"/><circle cx="1080" cy="285" r="3.5"/><circle cx="1095" cy="225" r="3.5"/>
      <circle cx="1180" cy="215" r="3.5"/><circle cx="1190" cy="160" r="3.5"/><circle cx="995" cy="270" r="3.5"/>
    </g>
    <g filter="url(#softglow)">
      <circle cx="950" cy="296" r="5" fill="#3ef0ff"/>
      <circle cx="1050" cy="240" r="5" fill="#6fb8ff"/>
      <circle cx="1150" cy="172" r="5" fill="#b18cff"/>
      <circle cx="1250" cy="112" r="6" fill="#ff4fd8"/>
    </g>
    <g transform="translate(1250 112)" filter="url(#glow)">
      <path d="M0 -14 L3.3 -3.3 L14 0 L3.3 3.3 L0 14 L-3.3 3.3 L-14 0 L-3.3 -3.3 Z" fill="#ffffff"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="27.5" fill="none" stroke="#7b6cff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- emblem: omega orbited by the island population -->
  <g transform="translate(72 72) scale(1)">
    <ellipse cx="128" cy="132" rx="118" ry="44" fill="none" stroke="url(#fade)" stroke-width="1.5" stroke-dasharray="2 6" transform="rotate(-18 128 132)"/>
    <ellipse cx="128" cy="132" rx="118" ry="44" fill="none" stroke="url(#fade)" stroke-width="1.5" stroke-dasharray="2 6" transform="rotate(22 128 132)"/>
    <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M62 190 H98 V176 A56 56 0 1 1 158 176 V190 H194" stroke-width="15"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="20" cy="166" r="5.5" fill="#3ef0ff"/>
      <circle cx="236" cy="92" r="4.5" fill="#ff4fd8"/>
      <circle cx="226" cy="192" r="6" fill="#b18cff"/>
      <circle cx="36" cy="80" r="4" fill="#7b6cff"/>
    </g>
    <g transform="translate(128 52)" filter="url(#glow)">
      <path d="M0 -12 L2.8 -2.8 L12 0 L2.8 2.8 L0 12 L-2.8 2.8 L-12 0 L-2.8 -2.8 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Inter', 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="372" y="186" font-size="68" font-weight="800" letter-spacing="6" fill="url(#neonH)" filter="url(#softglow)">OMEGA</text>
    <text x="372" y="250" font-size="68" font-weight="300" letter-spacing="6" fill="#e9ecff">TRANSFORM</text>
    <rect x="374" y="274" width="96" height="3" rx="1.5" fill="url(#neon)"/>
    <text x="374" y="312" font-size="20" font-weight="400" letter-spacing="1" fill="#aab2e6">Evolutionary program optimization with local LLMs</text>
    <text x="374" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#6f78b8">python · c/c++ · ollama · sandboxed · no cloud</text>
  </g>
</svg>
