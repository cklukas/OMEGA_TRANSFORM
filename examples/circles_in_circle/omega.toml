[problem]
name = "circles_in_circle_21"
language = "python"
initial = "initial.py"
category = "Mathematical constructions"
summary = "Place 21 circles in the unit circle so that their radii add up to as much as possible."
background = """
This is the same family of problems as circle packing in a square, with a round
container. Eckard Specht's [Packomania](https://packomania.com/) website collects the
best known packings of circles in a circle, for equal circles and for several families
of unequal ones, many found by computer searches over the years. Here the circles may
have different sizes and the sum of their radii counts, a variant for which the best
layouts are only known from computer searches.

The starting program puts one circle in the centre and rings of 7 and 13 around it, all
of the same radius (score about 3.19). A simple upper limit follows from area: the
circles cover at most the container, so the sum of the squared radii is at most 1, and
therefore the sum of 21 radii is at most the square root of 21, about 4.58. That limit
cannot be reached, because round circles always leave gaps.

It is hard because two kinds of decisions are mixed: how many circles of which size go
where (a combinatorial choice), and their exact positions (a continuous optimization
with 210 pairwise no-overlap conditions and 21 wall conditions). The gaps between
circles and the curved wall have awkward shapes, the best layouts are rigid with many
contacts, and only the Python standard library is available, so the optimizer has to be
written by hand and be fast.
"""
description = """
Place 21 non-overlapping circles inside the unit circle (center (0,0), radius 1) so that
the SUM OF THEIR RADII is as large as possible. run() returns construct(21): a list of
21 (x, y, r) tuples. Each circle must lie fully inside the container,
sqrt(x^2 + y^2) + r <= 1, no two circles may overlap, radii must be >= 0 and all values
finite (tolerance 1e-9). Only the Python standard library is available (numpy may be
missing). The program may run an optimization (for example on the centers, with radii
derived from them), but must finish well within the time limit (aim for at most 60
seconds of CPU time)."""
metrics_help = """
score = sum of radii (higher is better). Metrics: min_radius/max_radius;
area_fraction = sum of r^2, the fraction of the container covered; seconds = CPU time of
construct(21)."""
hints = """
Circles of equal size are rarely best for the sum of radii: mixing sizes and filling the
gaps near the container wall with smaller circles helps. Strong approaches: optimize
centers and radii jointly with a penalty method (maximize sum(r) minus a growing penalty
on squared overlaps and squared container violations, using gradient steps or
coordinate descent), then make the result exactly feasible: for fixed centers compute
the radii by shrinking violators, or by repeated passes that set each r_i to the largest
value allowed by the wall (1 - |c_i|) and its neighbors (d_ij - r_j). Simulated
annealing or random perturbation of the centers followed by this feasible-radius step
is a robust outer loop; use several restarts and keep the best. Shrink the final radii
by a factor like 1 - 1e-10 to stay safely within tolerance. Use a fixed random seed so
the result is reproducible."""

[evaluator]
command = ["{python}", "evaluate.py", "{candidate}"]
stages = [{ name = "main", timeout = 120 }]
concurrency = 4

[llm]
models = ["qwen3.5:latest"]
think = false   # true: slower, more deliberate answers

[search]
iterations = 150
islands = 4
migration_interval = 30
insights_interval = 20
features = [
  { name = "code_size", min = 0.25, max = 8.0, bins = 6, log = true },
  { name = "radius_spread", min = 0.0, max = 0.3, bins = 5 },
]
