[problem]
name = "heilbronn_13"
language = "python"
initial = "initial.py"
category = "Mathematical constructions"
summary = "Place 13 points in the unit square so that the smallest triangle they form is as large as possible."
description = """
Heilbronn triangle problem: place 13 points in the closed unit square [0,1]x[0,1] so that
the SMALLEST AREA among all 286 triangles formed by 3 of the points is as large as
possible. run() returns construct(13): a list of 13 (x, y) tuples. Every point must be
finite and inside the square (tolerance 1e-12). Only the Python standard library is
available (numpy may be missing). The program may run an optimization, but must finish
well within the time limit (aim for at most 60 seconds of CPU time)."""
metrics_help = """
score = min_area, the smallest triangle area (higher is better). Metrics:
normalized_min_area_n2 = min_area * 13^2; near_min_triangles = how many triangles are
within a relative 1e-6 of the minimum (good configurations balance many of them);
min_point_distance = closest pair of points; bounding_box_area = area of the box spanned
by the points; seconds = CPU time of construct(13). The feedback names the smallest
triangle and the next smallest areas."""
hints = """
Use the whole square: good configurations put several points on the boundary and in the
corners, and no three points are close to collinear. The objective is a max-min problem,
so improve it by optimizing many triangles at once: simulated annealing or random local
search on the point coordinates (accept moves that raise the minimum area, shrink the
step size over time), many random restarts, then a final polish. A smooth surrogate
works well with gradient-free or gradient steps: maximize a soft-min such as
-(1/beta) * log(sum(exp(-beta * area))) with beta increasing over time. Alternatively
treat it as maximizing t subject to area_i >= t (penalty method), moving only the points
of the currently smallest triangles. Clamp points to [0,1] after every move. Symmetric
starting layouts (e.g. point-symmetric about the center) are a good seed. Keep a fixed
random seed so the result is reproducible."""

[evaluator]
command = ["{python}", "evaluate.py", "{candidate}"]
stages = [{ name = "main", timeout = 120 }]
concurrency = 4

[llm]
models = ["qwen3.5:latest"]
think = false   # true: slower, more deliberate answers

[search]
iterations = 150
islands = 4
migration_interval = 30
insights_interval = 20
features = [
  { name = "code_size", min = 0.25, max = 8.0, bins = 6, log = true },
  { name = "min_point_distance", min = 0.05, max = 0.4, bins = 5 },
]
