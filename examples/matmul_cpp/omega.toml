[problem]
name = "matmul_f32"
language = "cpp"
initial = "matmul.cpp"
category = "Performance (C++)"
summary = "Multiply two 1024 × 1024 float matrices as fast as possible on all cores."
background = """
Matrix multiplication is the core of scientific computing, graphics and neural networks.
The textbook method needs n³ multiply-adds, about two billion operations for n = 1024.
Volker Strassen [showed in 1969](https://doi.org/10.1007/BF02165411) that fewer are
possible in principle, but in practice speed is a question of memory: fast libraries
([BLAS](https://doi.org/10.1145/355841.355847) since 1979, and Kazushige Goto's
GotoBLAS, described with Robert van de Geijn at UT Austin [in
2008](https://doi.org/10.1145/1356052.1356053)) do the same arithmetic in an order that
reuses data from the caches and registers.

The starting program is the textbook triple loop, about 1.6 GFLOPS. Its inner loop walks
down a column of B, jumping 4 KB in memory per step, so nearly every access misses the
cache and the processor mostly waits. The limit is the hardware: every core can do
several 4-wide vector multiply-adds per cycle, and the machine has 10 cores, a peak of
several hundred GFLOPS.

It is hard because reaching that peak needs several layers of restructuring at once:
blocks that fit the caches, a small tile of C kept in registers, vector instructions,
copying panels of A and B into contiguous buffers, and splitting the work over the cores
without them competing for memory bandwidth. All of it must stay exactly right for every
size from 1 to 2048, including sizes that do not divide into blocks.
"""
context_files = ["harness.cpp"]
description = """
Make the C++ function matmul(n, A, B, C) (single precision, row-major, C = A*B) as FAST
as possible on this machine (Apple Silicon, 10 cores, ARM NEON available via
<arm_neon.h>). It must stay correct for every n from 1 to 2048, including sizes that are
not multiples of any block size, and must write every element of C."""
metrics_help = """
score = GFLOPS at n = 1024 (best of 3 runs). Correctness is checked first on
n = 1, 7, 64, 131, 257; any wrong result makes the program invalid."""
hints = """
Known levers, roughly in order of payoff: loop order i-k-j so the inner loop streams
rows of B and C; cache blocking/tiling; register blocking (micro-kernel computing a
small tile of C held in registers); NEON fma intrinsics (vfmaq_f32) or code the compiler
auto-vectorizes; packing B into contiguous panels; multithreading over row blocks with
std::thread (10 cores)."""

[evaluator]
# Separate compilation: the candidate is compiled on its own (without read access to this
# directory), may define only matmul globally, and is then linked with harness.cpp.
compile = ["clang++", "-O3", "-march=native", "-std=c++20", "-pthread", "-c", "{candidate}", "-o", "{object}"]
link = ["clang++", "-O3", "-march=native", "-std=c++20", "-pthread", "{object}", "{problem_dir}/harness.cpp", "-o", "{binary}"]
exports = ["matmul"]
command = ["{python}", "evaluate.py", "{binary}", "{stage}"]
stages = [
  { name = "check", timeout = 60 },
  { name = "bench", timeout = 120, exclusive = true },
]
concurrency = 4
confirm_runs = 2   # timing noise is about ±5%: a new best must hold up in 3 runs (median)

[llm]
models = ["qwen3.5:latest"]
think = false   # true: slower, more deliberate answers
num_ctx = 32768

[search]
iterations = 150
islands = 3
migration_interval = 30
insights_interval = 20
