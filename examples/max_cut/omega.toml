[problem]
name = "max_cut"
language = "python"
initial = "initial.py"
category = "Algorithms and heuristics"
summary = "Split the nodes of a weighted graph into two sides so that as much edge weight as possible crosses."
background = """
Max-cut splits the nodes of a network into two groups so that as much connection weight
as possible runs between the groups. It appears in circuit layout, in physics (the
lowest-energy states of magnetic spin glasses) and in clustering. It is one of the 21
problems Richard Karp (UC Berkeley) [proved NP-complete in
1972](https://doi.org/10.1007/978-1-4684-2001-2_9). Michel Goemans and David Williamson
(MIT and IBM, [1995](https://doi.org/10.1145/227683.227684)) found a method guaranteed
to reach at least 87.8 % of the optimum; under a widely believed conjecture, no fast
method can guarantee more.

The starting program alternates the sides by node number and ignores the edges, so it
cuts about half the weight, like a random split (score about 0.51). Moving single nodes
to the side where they cut more reaches about 0.70. A score of 1.0 is impossible: in a
triangle at most two of the three edges can be cut, and the sparse random graphs contain
many such odd cycles. The true optimum is unknown.

It is hard because every node's best side depends on its neighbours' sides, which depend
on theirs. Simple improvement gets stuck where no single move helps, and escaping needs
deliberate worse moves (tabu search) or perturbations, with careful bookkeeping so that
thousands of moves fit into two seconds of Python.
"""
description = """
Write a heuristic for weighted max-cut. cut(n, edges) gets the number of nodes n and a
list of edges (u, v, w) with 0 <= u < v < n, no duplicate pairs and integer weight
1 <= w <= 10, and must return a list of n sides, each the int 0 or 1. The cut weight is
the sum of w over edges whose endpoints lie on different sides; the goal is the LARGEST
cut. It is run on three fixed sparse random graphs: 100 nodes / 400 edges, 200 nodes /
1200 edges, 400 nodes / 1600 edges. The time limit is 2.0 CPU seconds per graph,
measured with time.process_time() around the call; using more than 1.5 x the limit
(3.0 s) makes the program invalid, so check time.process_time() regularly and return
the best assignment found when time runs out. Only the Python standard library may be
used (no numpy)."""
metrics_help = """
score = mean over the three graphs of (cut weight / total edge weight). Higher is
better; a random or alternating split gets about 0.5 (the initial program scores about
0.51), simple one-flip local search about 0.7. Metrics per graph: <name>_cut,
<name>_total, <name>_ratio, <name>_cpu_s."""
hints = """
Known levers, roughly in order of payoff: build adjacency lists once; keep for every node
its gain (weight to its own side minus weight to the other side) and update the gains
of the neighbours incrementally after each flip instead of recomputing; greedy
construction (place nodes one by one on the side that cuts more weight to already
placed nodes); one-flip local search until no positive gain remains; tabu search (flip
the best non-tabu node even when the gain is negative, forbid flipping it back for a
tenure of roughly n/10 to n/5 steps plus randomness, aspiration when a move beats the
best cut); restarts or perturbations (flip a random 5-10% of the nodes) from the best
solution, keeping the best assignment found; memetic search that combines two good
assignments (keep the nodes where both agree) and re-optimizes."""

[evaluator]
command = ["{python}", "evaluate.py", "{candidate}"]
stages = [{ name = "main", timeout = 60 }]
concurrency = 4

[llm]
models = ["qwen3.5:latest"]
think = false

[search]
iterations = 150
islands = 3
migration_interval = 30
insights_interval = 20
features = [
  { name = "code_size", min = 0.25, max = 6.0, bins = 6, log = true },
  { name = "time_used", min = 0.0, max = 1.0, bins = 4 },
]
