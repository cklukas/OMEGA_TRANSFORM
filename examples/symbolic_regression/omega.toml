[problem]
name = "symbolic_regression"
language = "python"
initial = "initial.py"
category = "Data and modelling"
summary = "Find a formula that fits noisy data and still holds outside the training range."
background = """
Symbolic regression looks for the formula behind data, not just a curve that fits it.
Johannes Kepler found his third law of planetary motion (1619) this way in Tycho Brahe's
observations. John Koza (Stanford,
[1992](https://mitpress.mit.edu/9780262111706/genetic-programming/)) automated the
search with genetic programming, and Michael Schmidt and Hod Lipson (Cornell,
[2009](https://doi.org/10.1126/science.1165893)) recovered physical laws from measured
motion. Marco Virgolin and Solon Pissis [proved in
2022](https://openreview.net/forum?id=LTiaPxqe2e) that the search is NP-hard.

The starting program fits a straight-line model, y = c0 + c1·x1 + c2·x2 + c3·x3, and
scores about 0.31. The limit is the noise in the data, which caps the score at about
0.998.

It is hard because inside the training range many different formulas fit equally well: a
polynomial with enough terms can follow almost any smooth curve. Only the true form
keeps working outside that range, where half of the test rows lie. Fitting better is
therefore not enough; the program must find the right building blocks (products, powers,
sines) and leave out the wrong ones, a combinatorial search guided only by noisy data.
"""
description = """
Find the formula behind hidden data: y = f(x1, x2, x3) + Gaussian noise (sigma 0.1),
where f is a fixed, fairly compact closed-form expression (elementary functions,
products, powers, constants). The program defines fit(rows) -> params and
predict(params, x1, x2, x3) -> float; params must be plain data (numbers, strings,
lists, dicts; tuples arrive as lists), not functions or class instances. The evaluator
calls fit once with 300 training rows [x1, x2, x3, y] with x1 in [-3, 3], x2 in [-2, 2],
x3 in [0, 3], then predicts 300 held-out rows from the same ranges and 300
EXTRAPOLATION rows from wider ranges (x1 in [-4.5, 4.5], x2 in [-3, 3], x3 in [0, 4]).
A generic curve fit does well inside the training range but fails outside it; only
the right functional form extrapolates.
A fixed helper least_squares(columns, targets, ridge) outside the editable block solves
linear least squares, so a model linear in its coefficients over a set of basis
functions is fitted in one call. Every prediction must be a finite float. fit plus all
predictions: at most 10 CPU seconds. Only the Python standard library (no numpy).
The first training rows (x1, x2, x3, y):
   2.175 -0.337  0.085   -2.058
  -1.891 -0.025  2.441    1.796
  -2.056  0.295  2.016    0.117
  -2.148 -0.652  0.514    0.235
  -1.574  0.754  2.005   -1.164
   2.476 -0.654  0.957   -1.744
  -1.991 -0.655  1.067    0.695
  -1.158 -1.329  1.804    3.424
  -0.091 -0.237  2.429    1.684
  -1.998  0.445  2.732    1.307
  -0.117  1.678  2.649    1.694
   0.995 -0.134  0.686   -1.531
  -1.656  0.482  1.245   -1.680
  -1.511  0.856  1.586   -2.232
  -2.494 -0.762  2.362    2.592
  -2.948 -1.906  1.665    0.992"""
metrics_help = """
score = mean of R^2 on the in-range test rows and R^2 on the extrapolation rows, each
clipped to [0, 1] (higher is better, 1.0 = perfect; the noise limits it to about
0.998). The initial linear model scores about 0.31. Metrics: r2_test, rmse_test,
r2_extrapolation, rmse_extrapolation (the noise alone gives RMSE 0.1), cpu_s. The
feedback lists the five worst extrapolation rows with true and predicted y."""
hints = """
Treat it as a search over basis functions: the prediction is sum_j c_j * g_j(x1, x2, x3)
with the c_j fitted by least_squares. Good candidate terms: powers (x^2, x^3), pairwise
products (x1*x2, x2*x3, ...), sin/cos of an input and their products with other inputs,
exp, log(1 + x) for nonnegative inputs. Start broad (many terms), look at which
coefficients are clearly nonzero, then drop the rest: fewer, correct terms extrapolate
far better than many terms. Polynomials in x1 cannot extrapolate a periodic dependence.
fit itself may try several basis sets and pick the one with the lowest error on a
held-out part of the training rows (cross-validation), or prune terms greedily (forward
selection or backward elimination). Read the worst-error rows in the feedback: large
errors at large |x| reveal the wrong growth or a missing interaction."""

[evaluator]
command = ["{python}", "evaluate.py", "{candidate}"]
stages = [{ name = "main", timeout = 120 }]
concurrency = 4

[llm]
models = ["qwen3.5:latest"]
think = false

[search]
iterations = 150
islands = 3
migration_interval = 30
insights_interval = 20
